name: Trinity integrations checks
on:
  pull_request:
    paths:
      - 'Trinity/services/integration*.js'
      - 'Trinity/wrangler.integrations.jsonc'
      - 'Trinity/tests/integration-providers.test.mjs'
      - 'Trinity/tests/integrations.runtime.mjs'
      - 'Integrations-Worker/**'
      - '.github/workflows/integrations-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Trinity
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Trinity/package-lock.json
      - run: npm ci
      - run: node --test tests/integration-providers.test.mjs
      - run: npx wrangler deploy --config wrangler.integrations.jsonc --dry-run --outdir dist-integrations
      - run: npm ci --prefix ../Integrations-Worker
      - run: npm run build --prefix ../Integrations-Worker
      - run: npm ci --prefix ../Knowledge-Worker
      - run: npm run build --prefix ../Knowledge-Worker
      - run: node --test tests/integrations.runtime.mjs
