name: Trinity CI

on:
  push:
    branches: [main]
    paths:
      - 'Trinity/**'
      - '.github/workflows/webpack.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Trinity/**'
      - '.github/workflows/webpack.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trinity-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: npm
        cache-dependency-path: Trinity/package-lock.json

    - name: Install Trinity dependencies
      working-directory: Trinity
      run: npm ci

    - name: Audit production and development dependencies
      working-directory: Trinity
      run: npm audit --audit-level=high

    - name: Build and test Trinity
      working-directory: Trinity
      run: npm test
