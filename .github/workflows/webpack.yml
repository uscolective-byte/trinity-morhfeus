name: Trinity CI

on:
  push:
    branches: [main]
    paths:
      - 'Trinity/**'
      - 'packages/contracts/**'
      - 'packages/trinity-guardian/**'
      - 'scripts/**'
      - 'Audit-Worker/**'
      - 'PC-Bridge-Worker/**'
      - 'Local-Gateway/**'
      - 'Local-Desktop/**'
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - '.github/**'
  pull_request:
    branches: [main]
    paths:
      - 'Trinity/**'
      - 'packages/contracts/**'
      - 'packages/trinity-guardian/**'
      - 'scripts/**'
      - 'Audit-Worker/**'
      - 'PC-Bridge-Worker/**'
      - 'Local-Gateway/**'
      - 'Local-Desktop/**'
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trinity-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Cloudflare build, tests, dependency and AI policy
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            Trinity/package-lock.json
            PC-Bridge-Worker/package-lock.json
            Local-Gateway/package-lock.json

      - name: Install root tooling dependencies
        run: npm ci --ignore-scripts

      - name: Install TAP contracts dependencies
        working-directory: packages/contracts
        run: npm ci --ignore-scripts

      - name: Install Trinity dependencies
        working-directory: Trinity
        run: npm ci

      - name: Check synchronized release documentation
        run: npm run docs:check

      - name: Audit dependencies (high+)
        working-directory: Trinity
        run: npm audit --audit-level=high

      - name: Build Cloudflare Worker (dry-run, not deployment)
        working-directory: Trinity
        run: npm run build

      - name: Run Trinity unit tests
        working-directory: Trinity
        run: node --test --test-concurrency=1 tests/*.test.mjs

      - name: Validate Guardian package contract
        run: node --test Trinity/tests/guardian-package.test.mjs

      - name: Run signed Audit Worker tests
        run: node --test Audit-Worker/tests/*.test.mjs

      - name: Validate legacy root entry points against canonical sources
        run: |
          npm ci --prefix Jericho-Worker
          npm ci --prefix contracts/tetrakis
          node --test --test-concurrency=1 tests/*.test.mjs

      - name: Validate unified local desktop and provider adapters
        run: node --test Local-Desktop/tests/*.test.mjs

      - name: Validate PC Bridge Worker
        run: |
          npm ci --prefix PC-Bridge-Worker
          npm test --prefix PC-Bridge-Worker

      - name: Validate Local Gateway
        run: |
          npm ci --prefix Local-Gateway
          npm test --prefix Local-Gateway

      - name: Validate AI Change Policy against JSON Schema
        run: |
          node -e '
            const fs = require("fs");
            const schema = JSON.parse(fs.readFileSync(".github/ai-change-policy.schema.json", "utf8"));
            const data = JSON.parse(fs.readFileSync(".github/ai-change.json", "utf8"));
            for (const req of schema.required) {
              if (!(req in data)) throw new Error("Missing required field: " + req);
            }
            if (!schema.properties.risk.enum.includes(data.risk)) throw new Error("Invalid risk: " + data.risk);
            if (typeof data.reviewed !== "boolean") throw new Error("Invalid reviewed flag");
            console.log(".github/ai-change.json valid");
          '

      - name: Emit signed audit receipt on main (when configured)
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TRINITY_AUDIT_URL: ${{ secrets.TRINITY_AUDIT_URL }}
          TRINITY_AUDIT_HMAC_KEY: ${{ secrets.TRINITY_AUDIT_HMAC_KEY }}
          TRINITY_JOB_STATUS: ${{ job.status }}
          TRINITY_DEPLOY_ENV: development
        run: |
          if [ -n "$TRINITY_AUDIT_URL" ] && [ -n "$TRINITY_AUDIT_HMAC_KEY" ]; then
            node Trinity/scripts/create-audit-log.mjs
          else
            echo "Audit service secrets not configured in this repository; skipping external audit webhook."
          fi
      - name: Workflow summary
        if: always()
        run: |
          echo '### Trinity CI' >> "$GITHUB_STEP_SUMMARY"
          echo 'Build is only a Wrangler dry-run; NO deploy.' >> "$GITHUB_STEP_SUMMARY"
          echo 'ESLint and TypeScript typechecks not claimed until configured.' >> "$GITHUB_STEP_SUMMARY"
          echo 'CODEOWNER approval needs repository ruleset protection.' >> "$GITHUB_STEP_SUMMARY"
