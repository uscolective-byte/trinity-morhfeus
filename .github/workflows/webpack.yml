name: Trinity CI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: npm
        cache-dependency-path: Trinity/package-lock.json

    - name: Install Trinity dependencies
      working-directory: Trinity
      run: npm ci

    - name: Build and test Trinity
      working-directory: Trinity
      run: npm test
