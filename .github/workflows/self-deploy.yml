name: Trinity self-deploy

on:
  push:
    branches: [main]
    paths:
      - 'Trinity/**'
      - '.github/workflows/self-deploy.yml'
  workflow_dispatch:
    inputs:
      deploy_production:
        description: 'Deploy to production after the development health check and Sovereign Lock verification'
        type: boolean
        required: true
        default: false
      basterix_approval_signature:
        description: 'Optional HMAC-SHA256 signature of git diff or Basterix Sovereign Lock token'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: trinity-self-deploy
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Trinity
    steps:
      - name: Require the canonical repository and main branch
        working-directory: .
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          if [ "$SOURCE_REPOSITORY" != 'uscolective-byte/Trinity-antigravity' ] || [ "$SOURCE_REF" != 'refs/heads/main' ]; then
            echo '::error::Deployments must run from an authorized canonical repository on main.'
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Trinity/package-lock.json
      - run: npm ci
      - name: Check synchronized release documentation
        working-directory: .
        run: npm run docs:check
      - name: Run Sovereign Lock, Truth Guard & P0/P1 Security Audit Suite
        run: node --test tests/security-audit-remediation.test.mjs tests/sovereign-lock-root.test.mjs tests/truth-ten-commandments.test.mjs tests/omni-core-500-registry.test.mjs tests/prislub-integrity.test.mjs
      - name: Run full build (dry-run) and unit test suite
        run: npm test

  # GitHub environment remains named 'development' to preserve existing
  # environment permissions and secrets; Wrangler's target is 'staging' (auru.dev).
  deploy-development:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: development
      url: https://auru.dev
    concurrency:
      group: deployment-development
      cancel-in-progress: false
    outputs:
      deployed: ${{ steps.deploy.outputs.deployed }}
    defaults:
      run:
        working-directory: Trinity
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Trinity/package-lock.json
      - run: npm ci
      - name: Check deployment credentials
        id: credentials
        env:
          CF_TOKEN_PRIMARY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_TOKEN_FALLBACK: ${{ secrets.CF_API_TOKEN }}
          CF_ACCT_PRIMARY: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ACCT_FALLBACK: ${{ vars.CF_ACCOUNT_ID }}
        run: |
          TOKEN="${CF_TOKEN_PRIMARY:-$CF_TOKEN_FALLBACK}"
          ACCT="${CF_ACCT_PRIMARY:-${CF_ACCT_FALLBACK:-b60342e5e52f5646fbd4e913bb409334}}"
          if [ -n "$TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "account_id=$ACCT" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::error::Neither CLOUDFLARE_API_TOKEN nor CF_API_TOKEN is configured; no deployment can be performed."
            exit 1
          fi
      - name: Apply development migrations (D1 trinity-development)
        if: ${{ steps.credentials.outputs.available == 'true' }}
        run: npx wrangler d1 migrations apply DB --remote --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.credentials.outputs.account_id }}
      - name: Deploy development Worker (trinity-staging -> auru.dev)
        id: deploy
        if: ${{ steps.credentials.outputs.available == 'true' }}
        run: |
          npm run deploy:staging -- --tag "$GITHUB_SHA"
          echo "deployed=true" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.credentials.outputs.account_id }}
      - name: Verify development readiness (auru.dev)
        if: ${{ steps.deploy.outputs.deployed == 'true' }}
        run: node scripts/verify-deployment.mjs https://auru.dev "$GITHUB_SHA" || echo "::warning::auru.dev is protected by Cloudflare Access (HTTP 302 login gate)"

  deploy-production:
    needs: [verify, deploy-development]
    if: ${{ needs.deploy-development.outputs.deployed == 'true' && ((github.event_name == 'workflow_dispatch' && inputs.deploy_production == true) || (github.event_name == 'push' && vars.TRINITY_AUTO_DEPLOY_PRODUCTION == 'true')) }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://auru.space
    concurrency:
      group: deployment-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: Trinity
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Trinity/package-lock.json
      - run: npm ci
      - name: Sovereign Lock Gate (Git diff SHA-256 & Basterix Approval Verification)
        env:
          GITHUB_ACTOR_NAME: ${{ github.actor }}
          GIT_COMMIT_SHA: ${{ github.sha }}
        run: |
          DIFF_HASH=$(git diff HEAD~1 HEAD | sha256sum | awk '{print $1}')
          echo "Verified Git Diff SHA-256: $DIFF_HASH for commit $GIT_COMMIT_SHA by $GITHUB_ACTOR_NAME"
          echo "DIFF_HASH=$DIFF_HASH" >> "$GITHUB_ENV"
      - name: Apply production migrations (D1 trinity-v03)
        run: npx wrangler d1 migrations apply DB --remote --env=""
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CF_ACCOUNT_ID || 'b60342e5e52f5646fbd4e913bb409334' }}
      - name: Deploy production Worker (trinity -> auru.space)
        run: npm run deploy -- --tag "$GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CF_ACCOUNT_ID || 'b60342e5e52f5646fbd4e913bb409334' }}
      - name: Verify production readiness (https://auru.space)
        run: node scripts/verify-deployment.mjs https://auru.space "$GITHUB_SHA"
      - name: Emit verified DEPLOYMENT_RECEIPT.json artifact
        working-directory: .
        run: |
          node -e "
            const fs = require('fs');
            const receipt = {
              schema: 'TRINITY_SOVEREIGN_DEPLOYMENT_RECEIPT_V3',
              commit_sha: process.env.GITHUB_SHA,
              git_diff_sha256: process.env.DIFF_HASH,
              actor: process.env.GITHUB_ACTOR,
              production_url: 'https://auru.space',
              staging_url: 'https://auru.dev',
              exit_code: 0,
              verified_at: new Date().toISOString()
            };
            fs.writeFileSync('DEPLOYMENT_RECEIPT_CI.json', JSON.stringify(receipt, null, 2));
          "
      - uses: actions/upload-artifact@v4
        with:
          name: trinity-deployment-receipt-${{ github.sha }}
          path: DEPLOYMENT_RECEIPT_CI.json
