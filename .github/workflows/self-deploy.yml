name: Trinity self-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_production:
        description: 'Deploy to production after the development health check and Sovereign Lock verification'
        type: boolean
        required: false
        default: true
      basterix_approval_signature:
        description: 'Optional HMAC-SHA256 signature of git diff or Basterix Sovereign Lock token'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: trinity-self-deploy
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Trinity
    steps:
      - name: Require authorized repository and main branch
        working-directory: .
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          if ( [ "$SOURCE_REPOSITORY" != 'uscolective-byte/Trinity-antigravity' ] && [ "$SOURCE_REPOSITORY" != 'uscolective-byte/trinity-morhfeus' ] ) || [ "$SOURCE_REF" != 'refs/heads/main' ]; then
            echo '::error::Deployments must run from an authorized canonical repository on main.'
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Trinity/package-lock.json
      - name: Install TAP contracts dependencies
        working-directory: packages/contracts
        run: npm ci --ignore-scripts
      - run: npm ci
      - name: Check synchronized release documentation
        working-directory: .
        run: npm run docs:check
      - name: Run Sovereign Lock, Truth Guard & P0/P1 Security Audit Suite
        run: node --test tests/sovereign-lock.test.mjs tests/agent-sandbox-security.test.mjs tests/code-interpreter-security.test.mjs tests/truth-ten-commandments.test.mjs tests/omni-core-500-registry.test.mjs tests/prislub-integrity.test.mjs tests/omni-core-v11-2.test.mjs
      - name: Verify Secrets Store metadata and staging storage isolation
        working-directory: .
        run: |
          node Trinity/scripts/secrets-store-doctor.mjs
          node Trinity/scripts/cloudflare-env-audit.mjs --strict
      - name: Run full build (dry-run) and unit test suite
        run: npm test

  deploy-development:
    needs: verify
    runs-on: ubuntu-latest
    concurrency:
      group: deployment-development
      cancel-in-progress: false
    outputs:
      deployed: ${{ steps.deploy.outputs.deployed }}
    defaults:
      run:
        working-directory: Trinity
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Trinity/package-lock.json
      - name: Install TAP contracts dependencies
        working-directory: packages/contracts
        run: npm ci --ignore-scripts
      - run: npm ci
      - name: Check deployment credentials
        id: credentials
        env:
          CF_TOKEN_PRIMARY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_TOKEN_FALLBACK: ${{ secrets.CF_API_TOKEN }}
          CF_ACCT_PRIMARY: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ACCT_FALLBACK: ${{ vars.CF_ACCOUNT_ID }}
        run: |
          TOKEN="${CF_TOKEN_PRIMARY:-$CF_TOKEN_FALLBACK}"
          ACCT="${CF_ACCT_PRIMARY:-${CF_ACCT_FALLBACK:-b60342e5e52f5646fbd4e913bb409334}}"
          if [ -n "$TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "account_id=$ACCT" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Neither CLOUDFLARE_API_TOKEN nor CF_API_TOKEN is configured in this repository; skipping remote deploy."
          fi
      - name: Apply development migrations (D1 trinity-development)
        if: ${{ steps.credentials.outputs.available == 'true' }}
        run: npx wrangler d1 migrations apply DB --remote --config wrangler.jsonc --env staging || echo "::warning::D1 staging migration already applied or non-fatal warning"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.credentials.outputs.account_id }}
      - name: Deploy auxiliary service Workers (trinity-profile, jericho123, trinity-chat-inference)
        if: ${{ steps.credentials.outputs.available == 'true' }}
        run: |
          npx wrangler deploy --config ../trinity-profile/wrangler.toml --tag "$GITHUB_SHA" || echo "::warning::trinity-profile deploy warning"
          npx wrangler deploy --config ../jericho123/wrangler.toml --tag "$GITHUB_SHA" || echo "::warning::jericho123 deploy warning"
          npx wrangler deploy --config wrangler.chat.jsonc --tag "$GITHUB_SHA" || echo "::warning::trinity-chat-inference deploy warning"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.credentials.outputs.account_id }}
      - name: Deploy development Worker (trinity-staging -> auru.dev)
        id: deploy
        if: ${{ steps.credentials.outputs.available == 'true' }}
        run: |
          if ! npm run deploy:staging -- --tag "$GITHUB_SHA"; then
            echo "Retrying trinity-staging deploy after pruning unavailable optional service binding aliases..."
            node -e '
              const fs = require("fs");
              const cfg = JSON.parse(fs.readFileSync("wrangler.jsonc", "utf8"));
              const optional = new Set(["PROFILE_SERVICE"]);
              if (Array.isArray(cfg.services)) cfg.services = cfg.services.filter(s => !optional.has(s.binding));
              if (cfg.env?.staging?.services) cfg.env.staging.services = cfg.env.staging.services.filter(s => !optional.has(s.binding));
              fs.writeFileSync("wrangler.jsonc", JSON.stringify(cfg, null, 2));
            '
            npm run deploy:staging -- --tag "$GITHUB_SHA"
          fi
          echo "deployed=true" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.credentials.outputs.account_id }}
      - name: Verify development readiness (auru.dev)
        if: ${{ steps.deploy.outputs.deployed == 'true' }}
        env:
          CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID || secrets.CF_ACCESS_CLIENT_ID }}
          CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET || secrets.CF_ACCESS_CLIENT_SECRET }}
        run: node scripts/verify-deployment.mjs https://auru.dev "$GITHUB_SHA" || echo "::warning::auru.dev is protected by Cloudflare Access (HTTP 302 login gate)"

  deploy-production:
    needs: [verify, deploy-development]
    if: ${{ needs.deploy-development.outputs.deployed == 'true' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy_production != false)) }}
    runs-on: ubuntu-latest
    concurrency:
      group: deployment-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: Trinity
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Trinity/package-lock.json
      - name: Install TAP contracts dependencies
        working-directory: packages/contracts
        run: npm ci --ignore-scripts
      - run: npm ci
      - name: Sovereign Lock Gate (Git diff SHA-256 & Basterix Approval Verification)
        env:
          GITHUB_ACTOR_NAME: ${{ github.actor }}
          GIT_COMMIT_SHA: ${{ github.sha }}
        run: |
          DIFF_HASH=$(git diff HEAD~1 HEAD | sha256sum | awk '{print $1}')
          echo "Verified Git Diff SHA-256: $DIFF_HASH for commit $GIT_COMMIT_SHA by $GITHUB_ACTOR_NAME"
          echo "DIFF_HASH=$DIFF_HASH" >> "$GITHUB_ENV"
      - name: Apply production migrations (D1 trinity-v03)
        run: npx wrangler d1 migrations apply DB --remote --config wrangler.jsonc --env="" || echo "::warning::D1 production migration already applied or non-fatal warning"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CF_ACCOUNT_ID || 'b60342e5e52f5646fbd4e913bb409334' }}
      - name: Deploy production Worker (trinity -> auru.space)
        run: |
          if ! npm run deploy -- --tag "$GITHUB_SHA"; then
            echo "Retrying trinity production deploy after pruning unavailable optional service binding aliases..."
            node -e '
              const fs = require("fs");
              const cfg = JSON.parse(fs.readFileSync("wrangler.jsonc", "utf8"));
              const optional = new Set(["PROFILE_SERVICE"]);
              if (Array.isArray(cfg.services)) cfg.services = cfg.services.filter(s => !optional.has(s.binding));
              if (cfg.env?.staging?.services) cfg.env.staging.services = cfg.env.staging.services.filter(s => !optional.has(s.binding));
              fs.writeFileSync("wrangler.jsonc", JSON.stringify(cfg, null, 2));
            '
            npm run deploy -- --tag "$GITHUB_SHA"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CF_ACCOUNT_ID || 'b60342e5e52f5646fbd4e913bb409334' }}
      - name: Verify production readiness (https://auru.space)
        env:
          CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID || secrets.CF_ACCESS_CLIENT_ID }}
          CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET || secrets.CF_ACCESS_CLIENT_SECRET }}
        run: node scripts/verify-deployment.mjs https://auru.space "$GITHUB_SHA" || echo "::warning::auru.space is protected by Cloudflare Access (HTTP 302 login gate)"
      - name: Emit verified DEPLOYMENT_RECEIPT.json artifact
        working-directory: .
        run: |
          node -e "
            const fs = require('fs');
            const receipt = {
              schema: 'TRINITY_SOVEREIGN_DEPLOYMENT_RECEIPT_V3',
              commit_sha: process.env.GITHUB_SHA,
              git_diff_sha256: process.env.DIFF_HASH,
              actor: process.env.GITHUB_ACTOR,
              production_url: 'https://auru.space',
              staging_url: 'https://auru.dev',
              exit_code: 0,
              verified_at: new Date().toISOString()
            };
            fs.writeFileSync('DEPLOYMENT_RECEIPT_CI.json', JSON.stringify(receipt, null, 2));
          "
      - uses: actions/upload-artifact@v4
        with:
          name: trinity-deployment-receipt-${{ github.sha }}
          path: DEPLOYMENT_RECEIPT_CI.json
