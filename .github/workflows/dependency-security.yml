name: Dependency security
on:
  push:
    branches: [main]
    paths: ['**/package.json', '**/package-lock.json', '.github/workflows/dependency-security.yml']
  pull_request:
    paths: ['**/package.json', '**/package-lock.json', '.github/workflows/dependency-security.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        directory: ['.', Audit-Worker, Capacity-Worker, Integrations-Worker, Jericho-Worker, Knowledge-Worker, Local-Desktop, Local-Gateway, PC-Bridge-Worker, Trinity, contracts/tetrakis]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Audit all locked dependencies, including development tools
        working-directory: ${{ matrix.directory }}
        run: npm audit --package-lock-only --audit-level=low
  token-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: contracts/tetrakis
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: contracts/tetrakis/package-lock.json
      - run: npm ci
      - name: Compile and exercise the isolated local EVM
        run: npm test
