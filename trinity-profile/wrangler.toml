name = "trinity-profile"
main = "src/index.ts"
account_id = "b60342e5e52f5646fbd4e913bb409334"
compatibility_date = "2026-10-11"
compatibility_flags = ["nodejs_compat"]
preview_urls = false

[vars]
ENVIRONMENT = "production"
TOKEN_SALT = "trinity_sovereign_identity_v3"

[[d1_databases]]
binding = "DB"
database_name = "trinity-v03"
database_id = "ca8ea24e-f7db-431e-b8bf-97f713ae4533"

[[kv_namespaces]]
binding = "TRINITY_KV"
id = "0b92ed2717d742daa860f1827797297f"

[[services]]
binding = "TRINITY_SENTINEL"
service = "trinity-sentinel"

[[services]]
binding = "TRINITY_AUDIT"
service = "trinity-audit"

[[services]]
binding = "CORE"
service = "trinity-core"

[env.staging]
name = "trinity-profile-staging"
workers_dev = false
preview_urls = false
services = []

[env.staging.vars]
ENVIRONMENT = "staging"
TOKEN_SALT = "trinity_sovereign_identity_staging_v1"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "trinity-development"
database_id = "1cce5249-e044-4c93-868c-0df534a778b5"
migrations_dir = "migrations"

[[env.staging.kv_namespaces]]
binding = "TRINITY_KV"
id = "759143cfa6fb44d6a0f4c8e4951945c8"
